{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>📡 Ping 网络诊断</h2>
    <p style="color: #666; margin-bottom: 20px;">输入 IP 地址或域名进行网络连通性测试</p>

    <form method="post" action="/ping">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" name="ip" placeholder="例如: 8.8.8.8 或 baidu.com" style="flex: 1; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 1em; outline: none; font-family: 'Courier New', monospace;">
            <button type="submit" class="btn" style="margin-top: 0; background: #2c3e50; min-width: 100px;">🚀 Ping</button>
        </div>
    </form>

    {% if result %}
    <h3 style="color: #27ae60; margin-bottom: 10px;">✅ 执行结果</h3>
    <pre style="background: #1a1a1a; color: #00ff00; padding: 18px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all;">{{ result }}</pre>
    {% endif %}

    {% if error %}
    <h3 style="color: #e74c3c; margin-bottom: 10px;">❌ 执行错误</h3>
    <pre style="background: #1a1a1a; color: #ff5555; padding: 18px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all;">{{ error }}</pre>
    {% endif %}
</div>
{% endblock %}
