<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>帮助中心</title>
</head>
<body>
    <h1>帮助中心</h1>
    <p>欢迎来到用户信息管理平台的帮助中心！</p>
    <h2>功能介绍</h2>
    <ul>
        <li>用户登录 - 使用您的账号密码登录系统</li>
        <li>个人信息查看 - 登录后查看您的个人信息</li>
        <li>账户安全 - 平台采用 bcrypt 加密保护您的密码</li>
    </ul>
    <h2>常见问题</h2>
    <h3>如何登录？</h3>
    <p>在首页点击"前往登录"，输入您的用户名和密码即可。</p>
    <h3>忘记密码怎么办？</h3>
    <p>请联系管理员重置密码。</p>
    <h3>账户被锁定怎么办？</h3>
    <p>连续多次登录失败后，账户将暂时受限，请稍后再试。</p>
</body>
</html>
